name: Release Docker Images (HCU)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"  # 22:00 Beijing Time daily

permissions:
  contents: read

env:
  HARBOR_SITE: ${{ vars.HARBOR_SITE }}
  HARBOR_NAMESPACE: ${{ vars.HARBOR_NAMESPACE || 'jenkins/model_test_env' }}
  PYPI_URL: ${{ vars.PYPI_URL }}
  RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
  SGLANG_VERSION: "0.5.18"

jobs:
  build:
    # 需要能访问内网 pip 源 / 资源服务器 / Harbor 的自托管构建节点
    # 加镜像目标 = 改下面矩阵; image/DTK 版本号/输出 tag 全部按矩阵字段拼接,
    # 镜像总表格式: ${HARBOR_SITE}/hcu/base/dtk:<DTK版本>-<OS>-py<Python版本>
    runs-on: [ci, bw1100]
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk_tag: "26.04.1"
            os_tag: "ubuntu22.04"
            python_version: "3.10"
            torch_version: "2.11.0"
            # AICC 大版本, 安装脚本 --major 装该版本中日期最新的包 (26.04 段为 1.0.0)
            aicc_major: "1.0.0"
            # blas cut 版本, 安装脚本按版本+os 拉归档最新包覆盖到 /opt/dtk
            blas_cut_version: "26.04"
    outputs:
      docker_image: ${{ steps.gen-tag.outputs.docker_image }}
    env:
      # 直接基于预装 DTK 的基础镜像构建, CI 内不再安装 DTK
      BASE_IMAGE: ${{ vars.DTK_BASE_IMAGE || format('{0}/hcu/base/dtk:{1}-{2}-py{3}', vars.HARBOR_SITE, matrix.dtk_tag, matrix.os_tag, matrix.python_version) }}
      TORCH_VERSION: ${{ matrix.torch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成镜像 tag
        id: gen-tag
        env:
          DTK_TAG_NO_DOT: ${{ matrix.dtk_tag }}
        run: |
          DTK_TAG_NO_DOT="${DTK_TAG_NO_DOT//./}"
          # BUILD_TIME: 传给 Dockerfile 生成 /etc/image.info 的 built 段, 与产物 tag 时间段一致
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sglang:${SGLANG_VERSION}-${{ matrix.os_tag }}-dtk${DTK_TAG_NO_DOT}-py${{ matrix.python_version }}-${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=sglang:${SGLANG_VERSION}-latest" >> "$GITHUB_ENV"
          echo "docker_image=${HARBOR_SITE}/${HARBOR_NAMESPACE}/sglang:${SGLANG_VERSION}-${{ matrix.os_tag }}-dtk${DTK_TAG_NO_DOT}-py${{ matrix.python_version }}-${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: 构建镜像
        run: |
          FULL_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          FULL_LATEST_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"
          docker build \
            --network=host \
            --no-cache \
            -t "${FULL_TAG}" \
            -t "${FULL_LATEST_TAG}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "AICC_MAJOR=${{ matrix.aicc_major }}" \
            --build-arg "BLAS_CUT_VERSION=${{ matrix.blas_cut_version }}" \
            --build-arg "PYPI_URL=${PYPI_URL}" \
            --build-arg "RESOURCE_SERVER_URL=${RESOURCE_SERVER_URL}" \
            --build-arg "SGLANG_VERSION=${SGLANG_VERSION}" \
            --build-arg "TORCH_VERSION=${TORCH_VERSION}" \
            --build-arg "BUILD_TIME=${BUILD_TIME}" \
            -f docker/hcu.Dockerfile \
            .

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_SITE }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 推送镜像
        run: |
          echo "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          docker push "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          docker push "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"

      # 其他容器 job 会以 root 在共享 workspace 留下文件, 导致下次 checkout 清理失败
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true

  # Model deployment checks are scheduled independently by cookbook-deployment-smoke.yml.
  # Keep the image build and operator tests here.
  test-operator:
    needs: build
    uses: ./.github/workflows/nightly-test-operator-hcu.yml
    with:
      docker_image: ${{ needs.build.outputs.docker_image }}
    secrets: inherit
